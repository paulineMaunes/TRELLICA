<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#052639">
  <meta name="description" content="BeepCheck Pro — offline classroom management">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>BeepCheck Pro</title>
  <link rel="stylesheet" href="css/app.css">
  <!-- Optional: set your Google OAuth Web Client ID for Drive sync -->
  <script>
    // window.BEEPCHECK_GOOGLE_CLIENT_ID = 'YOUR_CLIENT_ID.apps.googleusercontent.com';
  </script>
</head>
<body>
  <aside id="sidebar">
    <div class="brand">
      <div class="brand-logo">BC</div>
      <div class="brand-text">BeepCheck Pro</div>
    </div>
    <nav class="nav">
      <button class="nav-btn active" data-route="dashboard"><span class="icon">⌂</span><span class="label">Dashboard</span></button>
      <button class="nav-btn" data-route="students"><span class="icon">👥</span><span class="label">Students</span></button>
      <button class="nav-btn" data-route="subjects"><span class="icon">📚</span><span class="label">Subjects</span></button>
      <button class="nav-btn" data-route="attendance"><span class="icon">✓</span><span class="label">Attendance</span></button>
      <button class="nav-btn" data-route="gradebook"><span class="icon">📊</span><span class="label">Gradebook</span></button>
      <button class="nav-btn" data-route="recitation"><span class="icon">🦆</span><span class="label">Recitation</span></button>
      <button class="nav-btn" data-route="seating"><span class="icon">▦</span><span class="label">Seating</span></button>
      <button class="nav-btn" data-route="grouper"><span class="icon">⬡</span><span class="label">Grouper</span></button>
      <button class="nav-btn" data-route="peer"><span class="icon">◎</span><span class="label">Peer Eval</span></button>
      <button class="nav-btn" data-route="calendar"><span class="icon">📅</span><span class="label">Calendar</span></button>
      <button class="nav-btn" data-route="todo"><span class="icon">☑</span><span class="label">To-Do</span></button>
      <button class="nav-btn" data-route="behavior"><span class="icon">✎</span><span class="label">Behavior</span></button>
      <button class="nav-btn" data-route="sticky"><span class="icon">📌</span><span class="label">Sticky Notes</span></button>
      <button class="nav-btn" data-route="reminders"><span class="icon">🔔</span><span class="label">Reminders</span></button>
      <button class="nav-btn" data-route="qr"><span class="icon">▣</span><span class="label">QR Codes</span></button>
      <button class="nav-btn" data-route="sync"><span class="icon">☁</span><span class="label">Data & Sync</span></button>
    </nav>
    <div class="sidebar-footer">
      <div class="sync-status">
        <span class="sync-dot offline" id="sync-dot"></span>
        <span id="sync-label">Checking…</span>
      </div>
      <button class="btn-icon" id="btn-collapse" title="Collapse menu" style="color:var(--text-on-dark)">⇄</button>
    </div>
  </aside>

  <div id="main">
    <header class="topbar">
      <button class="btn-icon" id="btn-menu" title="Menu" style="display:none">☰</button>
      <h1 id="page-title">Dashboard</h1>
    </header>
    <main id="content"></main>
  </div>

  <div id="toasts"></div>

  <script src="js/db.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/modules/students.js"></script>
  <script src="js/modules/subjects.js"></script>
  <script src="js/modules/attendance.js"></script>
  <script src="js/modules/gradebook.js"></script>
  <script src="js/modules/recitation.js"></script>
  <script src="js/modules/seating.js"></script>
  <script src="js/modules/grouper.js"></script>
  <script src="js/modules/peer.js"></script>
  <script src="js/modules/calendar.js"></script>
  <script src="js/modules/todo.js"></script>
  <script src="js/modules/behavior.js"></script>
  <script src="js/modules/sticky.js"></script>
  <script src="js/modules/reminders.js"></script>
  <script src="js/modules/qr.js"></script>
  <script src="js/app.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    @media (max-width: 768px) {
      #btn-menu { display: flex !important; }
    }
  </style>
</body>
</html>
